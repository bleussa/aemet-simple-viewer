<main>
  <h1>¿Qué tiempo hará mañana?</h1>

  <section class="filtros">
    <app-buscador-municipio
      class="buscador"
      [municipios]="municipios()"
      (busquedaCambiada)="busqueda.set($event)"
      (municipioSeleccionado)="municipio.set($event)"
    />
    <app-selector-unidad class="unidad" [(unidad)]="unidad" />
  </section>

  @if (prediccion.isLoading()) {
    <mat-progress-bar mode="indeterminate" aria-label="Cargando previsión" />
  }

  @if (mensajeError(); as mensaje) {
    <p class="error" role="alert">{{ mensaje }}</p>
  } @else if (resultado(); as resultado) {
    <app-prediccion-resultado [nombreMunicipio]="municipio()?.nombre ?? ''" [prediccion]="resultado" />
  } @else if (!municipio()) {
    <p class="ayuda">Busca un municipio para ver su previsión.</p>
  }
</main>
